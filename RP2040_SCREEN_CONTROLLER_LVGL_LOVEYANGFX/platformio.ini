; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = DCO4 Screen Controller
src_dir = .
default_envs = screen

[env:screen]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = pico
board_build.core = earlephilhower
board_build.usb_stack = tinyusb
board_build.arduino.earlephilhower.usb_manufacturer = DCO4
board_build.arduino.earlephilhower.usb_product = DCO4 Screen
board_build.f_cpu = 225000000L
lib_ldf_mode = chain+
lib_archive = no
lib_extra_dirs = ${platformio.src_dir}/_build_libs
lib_deps = 
	/media/NVME_DATA/Arduino/libraries/lvgl
	/media/NVME_DATA/Arduino/libraries/LovyanGFX
	/media/NVME_DATA/Arduino/libraries/U8g2
monitor_speed = 2000000
custom_usb_by_id = /dev/serial/by-id/usb-*DCO4_Screen*
monitor_port = /dev/serial/by-id/usb-*DCO4_Screen*
upload_port = /dev/serial/by-id/usb-*DCO4_Screen*
upload_protocol = picotool
extra_scripts = 
	pre:ldf_speedup.py
	post:no_verify_upload.py
build_unflags = -Os
build_flags = 
	-DCMAKE_BUILD_TYPE=Release
	-O3
	-DUSE_TINYUSB
	-DLV_CONF_PATH=\"/media/NVME_DATA/Arduino/libraries/lv_conf.h\"
build_src_filter = 
	+<*>
	-<backup/>
	-<_build_libs/>
	-<fela_U8g2/>
	-<docs/>
	-<.git/>
	-<.pio/>
	-<.cache/>
	-<.vscode/>
